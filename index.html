<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bcd8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI娘对线">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon/icon-180.png">
<link rel="icon" type="image/png" href="assets/icon/icon-192.png">
<title>AI娘对线</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="bg"></div>

    <!-- 标题 -->
    <section id="scr-title" class="screen active">
      <button class="icon pill" id="btn-full" title="全屏"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span>全屏</span></button>
      <div class="logo big">AI娘对线</div>
      <div class="subtitle">群聊卡牌大乱斗 · 谁先破防谁退群</div>
      <div id="title-parade" class="parade"></div>
      <div class="title-btns">
        <button class="btn primary" id="btn-start">开始游戏</button>
        <button class="btn" id="btn-rules">玩法说明</button>
        <button class="btn" id="btn-settings">设置</button>
        <button class="btn" id="btn-credits">素材署名</button>
      </div>
      <div class="foot">角色立绘与卡面由 AI 生成 · 配音为 AI 合成</div>
    </section>

    <!-- 选人 -->
    <section id="scr-select" class="screen">
      <div class="sel-head">
        <div class="logo mid">选择你的 AI娘</div>
        <div class="mode-switch">
          <button class="mode on" data-mode="3">三人乱斗</button>
          <button class="mode" data-mode="2">单挑</button>
          <button class="mode" data-mode="4">2v2</button>
          <button class="mode" data-mode="5">抢群主</button>
        </div>
      </div>
      <div class="sel-body">
        <div id="sel-grid"></div>
        <div id="sel-detail">
          <div class="sd-portrait"><img id="sd-img" alt=""></div>
          <div class="sd-info">
            <div class="sd-name" id="sd-name"></div>
            <div class="sd-title" id="sd-title"></div>
            <div class="sd-bio" id="sd-bio"></div>
            <div class="sd-hp" id="sd-hp"></div>
            <div id="sd-skills"></div>
            <button class="btn primary" id="btn-go">选她出战</button>
            <button class="btn small" id="btn-back">返回</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 牌桌 -->
    <section id="scr-game" class="screen">
      <div id="topbar">
        <div class="logo tiny">AI娘对线</div>
        <div id="info" title="牌堆里还有几张【宕机】，后面是下一张摸到宕机的概率">第 <b id="round">1</b> 轮 · 牌堆 <b id="deck">0</b> · 💣<b id="bombs">0</b><small id="risk"></small></div>
        <div class="tb-btns">
          <button class="icon pill" id="tb-speed" title="游戏速度（点一下换档）">快</button>
          <button class="icon" id="tb-set" title="设置">⚙</button>
          <button class="icon" id="tb-full" title="全屏"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
          <button class="icon" id="tb-music" title="音乐">♪</button>
          <button class="icon" id="tb-sfx" title="音效">🔊</button>
          <button class="icon" id="tb-rules" title="玩法">?</button>
          <button class="icon" id="tb-quit" title="退出">✕</button>
        </div>
      </div>
      <div id="seats"></div>
      <div id="table">
        <div id="pile"></div>
        <div id="known" class="hidden"></div>
        <div id="phase"></div>
      </div>
      <div id="chat"><div class="chat-head">💬 AI娘 相亲相爱一家人（<span id="chat-n">3</span>）</div><div id="chat-list"></div></div>
      <div id="hand"></div>
      <div id="prompt" class="hidden"><div id="prompt-text"></div><div id="prompt-btns"></div><div id="prompt-timer"></div></div>
      <div id="actions">
        <div id="hint"></div>
        <div id="skillbox"></div>
        <button class="btn primary" id="btn-end">结束回合</button>
      </div>
      <div id="fx"></div>
    </section>

    <!-- 弹层 -->
    <div id="modal" class="hidden"><div class="modal-box"><div id="modal-body"></div><button class="btn" id="modal-close">关闭</button></div></div>
    <div id="toast"></div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/credits.js"></script>
<script src="js/voices.js"></script>
<script src="js/audio.js"></script>
<script src="js/settings.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
